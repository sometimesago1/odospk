{% load static %}

<form action="{% url 'directions' %}" class="col-span-3 p-6 col-start-10 row-span-1 row-start-2 bg-neutral-200 mb-16 rounded-3.5xl" method="POST">
    {% csrf_token %}
    <h3 class="text-2xl leading-none text-center font-semi-bold text-neutral-850">Оставьте заявку - и мы поможем с подбором направления и курса</h3>
    <div class="flex flex-col mt-9 gap-9">
        {% for field in consult_form %}
            {% if field.name != 'checkbox' %}
                <div class="flex flex-col w-full">
                    <label for="{{ field.id_for_label }}" class="mb-3 text-lg font-semibold text-neutral-850">{{ field.label }}</label>
                    {{ field }}
                        
                    {% if field.errors %}
                        <div class="text-sm text-red-500">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endif %}
        {% endfor %}
        <button type="submit" class="w-full px-6 py-6 mb-1 font-semibold leading-none text-white bg-blue-600 rounded-2xl hover:bg-blue-700">Помогите мне с выбором</button>
    </div>
    <div class="flex items-start col-span-5 gap-4 mt-4">
        {{ consult_form.checkbox}}
        <label class="text-base leading-5 cursor-pointer text-neutral-500" for="{{ consult_form.checkbox.id_for_label }}">{{ consult_form.checkbox.label}}</label>
    </div>
</form>
